  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 40px; position: relative; z-index: 2; }
  /* floating music notes */
  .notes { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .notes span { position: absolute; bottom: -40px; font-size: 28px; color: rgba(255,255,255,.85);
    text-shadow: 0 2px 6px rgba(0,0,0,.15); animation: floatUp linear infinite; }
  .notes span:nth-child(1){ left:6%;  animation-duration:11s; animation-delay:0s;  font-size:26px; }
  .notes span:nth-child(2){ left:18%; animation-duration:14s; animation-delay:3s;  font-size:34px; color:#ffd9ec; }
  .notes span:nth-child(3){ left:38%; animation-duration:10s; animation-delay:1s;  font-size:22px; }
  .notes span:nth-child(4){ left:58%; animation-duration:13s; animation-delay:5s;  font-size:30px; color:#fff3b0; }
  .notes span:nth-child(5){ left:76%; animation-duration:12s; animation-delay:2s;  font-size:26px; color:#ffd9ec; }
  .notes span:nth-child(6){ left:90%; animation-duration:15s; animation-delay:4s;  font-size:32px; }
  @keyframes floatUp { from { transform: translateY(0) rotate(-8deg); opacity: 0; }
    15% { opacity: 1; } 85% { opacity: 1; }
    to { transform: translateY(-105vh) rotate(10deg); opacity: 0; } }

  header { text-align: center; margin: 6px 0 4px; }
  .level { display: inline-block; background: #ff8c42; color: #fff; font-weight: 700;
    font-size: 15px; padding: 4px 14px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  h1 { margin: 10px 0 4px; font-size: 34px; color: #1e5c26; text-shadow: 0 2px 0 #fff; letter-spacing: 2px; }
  .sub { margin: 0; font-size: 17px; color: #3c6b3f; font-weight: 600; }
  .howto { background: rgba(255,255,255,.92); border: 3px dashed #7ec850; border-radius: 16px;
    padding: 10px 14px; margin: 14px 0 6px; font-size: 16px; line-height: 1.6; text-align: center; }
  .howto b { color: #e56b00; } .howto .b2 { color: #1565c0; }
  .progress { text-align: center; font-size: 17px; font-weight: 700; color: #1e5c26; margin: 10px 0 4px; }
  .dots { text-align: center; margin-bottom: 6px; }
  .dots i { display: inline-block; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 2px solid #7ec850; margin: 0 5px; }
  .dots i.done { background: #43a047; border-color: #43a047; }

  /* cards */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
  .card { position: relative; background: rgba(255,255,255,.96); border: 4px solid #fff;
    border-radius: 22px; padding: 10px 8px 12px; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 12px rgba(30,90,40,.25); transition: transform .12s, border-color .12s, box-shadow .12s; }
  .card:active { transform: scale(.97); }
  .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 14px; display: block; }
  .card .name { font-size: 21px; font-weight: 800; color: #2e4a2f; margin-top: 8px; }
  .card .sound { font-size: 17px; color: #e56b00; font-weight: 700; }
  .card .tap { font-size: 14px; color: #7a9a7d; margin-top: 2px; }
  .card.current { border-color: #ffb300; box-shadow: 0 0 0 4px rgba(255,179,0,.45), 0 4px 14px rgba(30,90,40,.3); }
  .card .badge { position: absolute; top: 8px; right: 8px; min-width: 52px; padding: 4px 10px;
    border-radius: 999px; font-size: 18px; font-weight: 800; color: #fff; display: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .card .badge.strong { display: inline-block; background: #ff8c42; }
  .card .badge.weak { display: inline-block; background: #42a5f5; }
  .card .mark { position: absolute; top: -12px; left: -8px; width: 46px; height: 46px; border-radius: 50%;
    display: none; align-items: center; justify-content: center; font-size: 28px; font-weight: 900;
    color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  .card.correct { border-color: #43a047; }
  .card.correct .mark { display: flex; background: #43a047; }
  .card.wrong { border-color: #e53935; animation: shake .3s; }
  .card.wrong .mark { display: flex; background: #e53935; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .card .playing { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,.95);
    border-radius: 999px; padding: 3px 10px; font-size: 14px; font-weight: 700; color: #e56b00; display: none; }
  .card.is-playing .playing { display: inline-block; }
  .card.is-playing img { outline: 3px solid #ffb300; outline-offset: -3px; }

  /* bottles */
  .bottle-title { text-align: center; font-size: 19px; font-weight: 800; color: #1e5c26;
    margin: 18px 0 8px; text-shadow: 0 1px 0 #fff; }
  .bottles { display: flex; gap: 16px; justify-content: center; }
  .bottle { width: 46%; max-width: 240px; background: rgba(255,255,255,.96); border: 5px solid transparent;
    border-radius: 22px; padding: 10px 8px 12px; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 12px rgba(30,90,40,.25); transition: transform .12s, border-color .12s; }
  .bottle:active { transform: scale(.96); }
  .bottle img { width: 100%; height: 130px; object-fit: cover; border-radius: 14px; display: block; }
  .bottle .blabel { font-size: 30px; font-weight: 900; margin-top: 6px; }
  .bottle.strong .blabel { color: #e56b00; }
  .bottle.weak .blabel { color: #1565c0; }
  .bottle .bdesc { font-size: 14px; color: #7a9a7d; }
  .bottle.selected { border-color: #43a047; box-shadow: 0 0 0 4px rgba(67,160,71,.4), 0 4px 14px rgba(30,90,40,.3); }
  .bottle.strong { border-bottom: 6px solid #ff8c42; }
  .bottle.weak { border-bottom: 6px solid #42a5f5; }

  .actions { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  .btn { font-family: inherit; font-size: 19px; font-weight: 800; border: none; border-radius: 999px;
    padding: 13px 26px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
  .btn:active { transform: scale(.96); }
  .btn-check { background: #43a047; color: #fff; }
  .btn-reset { background: #fff; color: #2e7d32; border: 2px solid #7ec850; }
  .hint { min-height: 30px; text-align: center; font-size: 18px; font-weight: 700; margin-top: 12px; }
  .hint.good { color: #2e7d32; } .hint.bad { color: #c62828; } .hint.info { color: #5d4037; }

  /* pass overlay */
  .pass { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(20,60,25,.55); padding: 20px; }
  .pass.show { display: flex; }
  .pass-card { background: #fffdf5; border-radius: 26px; border: 5px solid #ffb300; max-width: 420px; width: 100%;
    text-align: center; padding: 28px 22px 24px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .pass-card .big { font-size: 52px; }
  .pass-card h2 { font-size: 30px; color: #2e7d32; margin: 6px 0; }
  .pass-card p { font-size: 18px; line-height: 1.6; color: #4e6b50; margin: 6px 0 18px; }
  .next-btn { display: inline-block; background: #ff8c42; color: #fff; font-size: 22px; font-weight: 900;
    text-decoration: none; padding: 14px 30px; border-radius: 999px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .next-btn:active { transform: scale(.96); }
  .again { display: block; margin-top: 14px; background: none; border: none; font-size: 16px;
    color: #7a9a7d; text-decoration: underline; cursor: pointer; font-family: inherit; }

  footer { text-align: center; font-size: 14px; color: #3c6b3f; margin-top: 22px; line-height: 1.7; }
  footer .off { background: rgba(255,255,255,.85); border-radius: 999px; padding: 3px 12px; font-weight: 700; }
  @media (max-width: 420px) {
    h1 { font-size: 28px; }
    .card img { height: 118px; }
    .bottle img { height: 104px; }
    .card .name { font-size: 19px; }
  }
</style>
</head>

};

  var realAudio = {};
  function getReal(id) {
    if (!realAudio[id]) {
      realAudio[id] = new Audio(REAL_SOUNDS[id]);
      realAudio[id].preload = "auto";
    }
    return realAudio[id];
  }

  /* ---------- Web Audio: wind + ding / buzz / fanfare ---------- */
  var actx = null;
  function ac() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === "suspended") { actx.resume(); }
    return actx;
  }
  function tone(freq, t0, dur, type, vol) {
    var ctx = ac(); if (!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function playDing() {
    var ctx = ac(); if (!ctx) return; var t = ctx.currentTime;
    tone(1318.5, t, 0.18, "sine", 0.25); tone(1760, t + 0.12, 0.3, "sine", 0.25);
  }
  function playBuzz() {
    var ctx = ac(); if (!ctx) return; var t = ctx.currentTime;
    tone(140, t, 0.35, "sawtooth", 0.15); tone(110, t + 0.05, 0.3, "sawtooth", 0.12);
  }
  function playFanfare() {
    var ctx = ac(); if (!ctx) return; var t = ctx.currentTime;
    var seq = [[523.25,0],[659.25,0.15],[783.99,0.3],[1046.5,0.45],[783.99,0.65],[1046.5,0.8]];
    seq.forEach(function (n) { tone(n[0], t + n[1], 0.35, "triangle", 0.28); tone(n[0]*2, t + n[1], 0.2, "sine", 0.08); });
    tone(1318.5, t + 1.05, 0.6, "triangle", 0.25);
  }
  function playPop() { var ctx = ac(); if (!ctx) return; tone(880, ctx.currentTime, 0.12, "sine", 0.18); }
  /* wind: soft filtered-noise swells (synthesised, as in the video feel) */
  function playWind() {
    var ctx = ac(); if (!ctx) return;
    var dur = 3.2, len = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = ctx.createBufferSource(); src.buffer = buf;
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 500; bp.Q.value = 0.6;
    var g = ctx.createGain(); var t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.9);   /* swell 1 */
    g.gain.exponentialRampToValueAtTime(0.05, t + 1.7);
    g.gain.exponentialRampToValueAtTime(0.20, t + 2.4);   /* swell 2 */
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    bp.frequency.setValueAtTime(380, t);
    bp.frequency.linearRampToValueAtTime(750, t + 1.6);
    bp.frequency.linearRampToValueAtTime(480, t + dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + dur);
  }

  var windTimer = null;
  function playSound(id) {
    ac(); // unlock audio on the user gesture
    document.querySelectorAll(".card.is-playing").forEach(function (el) { el.classList.remove("is-playing"); });
    var card = cards[id]; if (!card) return;
    card.classList.add("is-playing");
    if (id === "wind") { playWind(); setTimeout(function(){ card.classList.remove("is-playing"); }, 3200); return; }
    try {
      var a = getReal(id);
      a.pause(); a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
      a.onended = function(){ card.classList.remove("is-playing"); };
      setTimeout(function(){ card.classList.remove("is-playing"); }, 4500);
    } catch (e) { card.classList.remove("is-playing"); }
  }

  /* ---------- UI ---------- */
  function setHint(text, cls) { hintEl.textContent = text; hintEl.className = "hint " + (cls || "info"); }
  function updateProgress() {
    var n = Object.keys(choices).length;
    progressEl.textContent = "已选 " + n + " / 4";
    var dots = dotsEl.querySelectorAll("i");
    dots.forEach(function (d, i) { d.classList.toggle("done", i < n); });
  }
  function refreshBottles() {
    var sel = current ? choices[current] : null;
    document.getElementById("bottleStrong").classList.toggle("selected", sel === "strong");
    document.getElementById("bottleWeak").classList.toggle("selected", sel === "weak");
  }
  function refreshCards() {
    Object.keys(cards).forEach(function (id) {
      var el = cards[id];
      el.classList.toggle("current", id === current);
      var badge = el.querySelector(".badge");
      if (choices[id]) { badge.textContent = LEVEL_NAME[choices[id]]; badge.className = "badge " + choices[id]; }
      else { badge.textContent = ""; badge.className = "badge"; }
      if (!checked) { el.classList.remove("correct", "wrong"); el.querySelector(".mark").textContent = ""; }
    });
  }
  function refreshAll() { refreshCards(); refreshBottles(); updateProgress(); }

  function selectCard(id) {
    if (passed) return;
    current = id;
    playSound(id);
    if (checked) { checked = false; refreshCards(); }
    refreshAll();
    setHint("正在听：" + NAMES[id] + "，它是大声还是小声呢？点下面的魔法瓶吧！", "info");
  }

  function chooseBottle(level) {
    if (passed) return;
    if (!current) { setHint("先点一张卡片，听一听它是什么声音吧！👂", "info"); return; }
    choices[current] = level;
    playPop();
    var wasChecked = checked;
    if (checked) { checked = false; refreshCards(); }
    refreshAll();
    if (Object.keys(choices).length === 4) {
      setHint("四张卡片都选好啦，正在检查……", "info");
      setTimeout(checkAnswers, 500);
    } else {
      setHint(NAMES[current] + "装进了「" + LEVEL_NAME[level] + "」魔法瓶 ✨ 再点下一张卡片听一听吧！", "good");
    }
  }

  function checkAnswers() {
    if (passed) return;
    if (Object.keys(choices).length < 4) {
      setHint("还有卡片没选魔法瓶哦，先把四张都选好吧！", "info");
      return;
    }
    checked = true;
    var wrongIds = [];
    Object.keys(cards).forEach(function (id) {
      var el = cards[id], ok = choices[id] === ANSWERS[id];
      el.classList.remove("correct", "wrong");
      var mark = el.querySelector(".mark");
      if (ok) { el.classList.add("correct"); mark.textContent = "✓"; }
      else { el.classList.add("wrong"); mark.textContent = "✗"; wrongIds.push(id); }
    });
    if (wrongIds.length === 0) {
      passed = true;
      playDing(); setTimeout(playFanfare, 250);
      setHint("🎉 全部答对！你真棒！", "good");
      setTimeout(function () { passEl.classList.add("show"); }, 700);
    } else {
      playBuzz();
      var names = wrongIds.map(function (id) { return NAMES[id]; }).join("、");
      setHint("😮 " + names + " 还不太对哦！再听一听，换一换魔法瓶试试吧！", "bad");
    }
  }

  function resetGame() {
    choices = {}; current = null; checked = false; passed = false;
    passEl.classList.remove("show");
    refreshAll();
    setHint("先点一张卡片，听一听它是什么声音吧！👂", "info");
  }

  document.querySelectorAll(".card").forEach(function (el) {
    el.addEventListener("click", function () { selectCard(el.dataset.id); });
  });
  document.querySelectorAll(".bottle").forEach(function (el) {
    el.addEventListener("click", function () { chooseBottle(el.dataset.level); });
  });
  document.getElementById("checkBtn").addEventListener("click", checkAnswers);
  document.getElementById("resetBtn").addEventListener("click", resetGame);
  document.getElementById("againBtn").addEventListener("click", resetGame);

  refreshAll();
  /* expose a tiny hook for automated testing only (no network, no behaviour change) */
  window.__L2__ = { get choices(){ return choices; }, get current(){ return current; },
    get passed(){ return passed; }, ANSWERS: ANSWERS,
    realSounds: REAL_SOUNDS };
})();
