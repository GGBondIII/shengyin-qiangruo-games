<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音浪球</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #070b1d; overflow: hidden; overscroll-behavior: none; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  #floor { position: absolute; left: 0; right: 0; bottom: 1px; height: 2px; background: rgba(255,255,255,0.18); }
  .ball { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; }
  #volbar { position: fixed; top: 14px; left: 4%; right: 4%; height: 40px; z-index: 5; pointer-events: none; }
  #volTrack { position: relative; height: 14px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.35); border-radius: 7px; pointer-events: auto; cursor: pointer; touch-action: none; }
  #volFill { height: 100%; width: 0%; background: linear-gradient(90deg, #38d977, #ffd23f 55%, #ff5a5a); border-radius: 7px; transition: width 0.08s linear; }
  #volMark { position: absolute; left: 30%; top: -5px; bottom: -5px; width: 3px; background: #fff; }
  #volMarkLabel { position: absolute; left: 30%; top: 20px; transform: translateX(-50%); font-size: 12px; color: #fff; opacity: 0.9; white-space: nowrap; }
  #volText { position: absolute; right: 0; top: 20px; font-size: 13px; font-weight: bold; color: #fff; }
  #hint { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; font-size: 13px; color: rgba(255,255,255,0.85); background: rgba(0,0,0,0.35); padding: 4px 12px; border-radius: 10px; white-space: nowrap; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><div id="floor"></div></div>
<div id="volbar">
  <div id="volTrack">
    <div id="volFill"></div>
    <div id="volMark"></div>
  </div>
  <div id="volMarkLabel">30% 跳到一半</div>
  <div id="volText">0%</div>
</div>
<div id="hint">正在准备…</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');
  var volFill = document.getElementById('volFill');
  var volText = document.getElementById('volText');
  var volTrack = document.getElementById('volTrack');
  var volMark = document.getElementById('volMark');
  var volMarkLabel = document.getElementById('volMarkLabel');
  // 可调阈值线（音量条上的白线，可以左右拖）：音量达到线的位置时，小球跳到屏幕一半高；
  // 比线再高 45% 就跳到屏幕最上方；再往上，高度封顶、改成跳得越来越快。
  var threshold = 0.30;
  function setThreshold(v) {
    threshold = Math.max(0.05, Math.min(0.95, v));
    volMark.style.left = (threshold * 100) + '%';
    volMarkLabel.style.left = (threshold * 100) + '%';
    volMarkLabel.textContent = Math.round(threshold * 100) + '% 跳到一半';
  }
  function thresholdFromEvent(e) {
    var rect = volTrack.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width;
  }
  var draggingThreshold = false;
  volTrack.addEventListener('pointerdown', function (e) {
    draggingThreshold = true;
    if (volTrack.setPointerCapture) volTrack.setPointerCapture(e.pointerId);
    setThreshold(thresholdFromEvent(e));
  });
  volTrack.addEventListener('pointermove', function (e) {
    if (draggingThreshold) setThreshold(thresholdFromEvent(e));
  });
  volTrack.addEventListener('pointerup', function () { draggingThreshold = false; });
  volTrack.addEventListener('pointercancel', function () { draggingThreshold = false; });
  var COLORS = ['#ff7eb6', '#c58cff', '#5aa9ff', '#3fd9a4', '#ffd23f', '#ff8a3d', '#ffffff', '#ff6b6b', '#7ef0e0', '#b8ff5e'];
  var balls = [];
  var W = 0, H = 0;
  var level = 0, targetLevel = 0;
  var mode = 'idle'; // idle | mic | demo（麦克风不可用时自动演示）
  var audioCtx = null, analyser = null, stream = null, dataArray = null;
  var lastW = 0, lastH = 0;
  function viewSize() {
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!w || !h) {
      var de = document.documentElement || {};
      w = w || de.clientWidth || 960;
      h = h || de.clientHeight || 540;
    }
    return { w: Math.max(320, w), h: Math.max(200, h) };
  }
  function resize() {
    var oldW = lastW, oldH = lastH;
    var s = viewSize();
    W = s.w; H = s.h;
    if (!balls.length) { initBalls(); }
    else if (oldW > 0 && oldH > 0 && (W !== oldW || H !== oldH)) {
      // 窗口变了：横向按比例挪，纵向一律落回新底部
      var sx = W / oldW;
      balls.forEach(function (b) {
        b.x = Math.min(Math.max(b.x * sx, b.r), W - b.r);
        b.baseY = H - b.r - 2;
        if (b.y > b.baseY) b.y = b.baseY;
      });
    }
    lastW = W; lastH = H;
    render(Date.now() / 1000);
  }
  function initBalls() {
    balls = [];
    for (var i = 0; i < 60; i++) {
      var r = 14 + Math.random() * 26;
      var y = H - r - 2; // 静止时全部落在屏幕底部（贴着地面线）
      var color = COLORS[i % COLORS.length];
      var el = document.createElement('div');
      el.className = 'ball';
      el.style.width = (r * 2) + 'px';
      el.style.height = (r * 2) + 'px';
      el.style.background = 'radial-gradient(circle at 32% 30%, #ffffff 0%, ' + color + ' 30%, ' + color + ' 100%)';
      stage.appendChild(el);
      balls.push({ x: 30 + Math.random() * Math.max(60, W - 60), y: y, r: r, baseY: y, vy: 0, phase: Math.random() * Math.PI * 2, speed: 0.6 + Math.random() * 1.4, color: color, alpha: 0.75 + Math.random() * 0.25, el: el });
      el.style.opacity = balls[i].alpha;
    }
  }
  function render() {
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      b.el.style.transform = 'translate(' + (b.x - b.r) + 'px,' + (b.y - b.r) + 'px)';
    }
  }
  var lastFrameAt = 0;
  function tick() {
    requestAnimationFrame(tick); // 先约好下一帧，这一帧就算出错动画也不会停
    step();
  }
  function step() {
    try {
      lastFrameAt = Date.now();
      if (mode === 'demo') {
        var now0 = Date.now() / 1000;
        targetLevel = 0.05 + 0.03 * Math.sin(now0 * 0.9);
      }
      level += (targetLevel - level) * 0.18;
      if (Math.abs(targetLevel - level) < 0.002) level = targetLevel;
      volFill.style.width = Math.round(level * 100) + '%';
      volText.textContent = Math.round(level * 100) + '%';
      var now = Date.now() / 1000;
      // 音量 → 跳高：达到阈值线 = 半屏高；阈值+45% = 满屏高；再往上高度封顶、频率加快
      var topPoint = Math.min(0.98, threshold + 0.45);
      var hFrac, excess = 0;
      if (level <= threshold) hFrac = threshold > 0 ? 0.5 * (level / threshold) : 0;
      else if (level <= topPoint) hFrac = 0.5 + 0.5 * (level - threshold) / (topPoint - threshold);
      else { hFrac = 1; excess = Math.min(1, (level - topPoint) / Math.max(0.02, 1 - topPoint)); }
      var k = 1 + excess * 1.2;        // 频率倍数：最高约 2.2 倍速
      var grav = 0.7 * k * k;          // 重力和初速同比例放大，高度不变、来回更快
      var apexPx = hFrac * Math.max(60, H - 90);
      balls.forEach(function (b) {
        if (b.y >= b.baseY - 0.5 && b.vy >= 0) {
          // 落在底部：按目标高度算弹跳初速，安静时（音量≈0）就停在底部
          if (level > 0.03 && apexPx > 2) {
            var f = 0.65 + 0.35 * (b.speed - 0.6) / 1.4; // 每个球高低错开，最快的达到目标高度
            b.vy = -Math.sqrt(2 * grav * apexPx * f) * (0.9 + Math.random() * 0.2);
            if (b.vy > -1.2) b.vy = -1.2; // 有一点声音至少轻轻颤一下
          } else {
            b.vy = 0; b.y = b.baseY;
          }
        }
        if (b.vy !== 0 || b.y < b.baseY) {
          b.vy += grav; b.y += b.vy;
          if (b.y > b.baseY) { b.y = b.baseY; b.vy = 0; }
          if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.55; }
          b.x += Math.sin(now * 1.2 + b.phase) * 0.4 * level;
        }
        if (b.x < b.r) b.x = b.r; if (b.x > W - b.r) b.x = W - b.r; if (b.y < b.r) b.y = b.r;
      });
      render();
    } catch (err) { /* 单帧出错不许停掉整个动画 */ }
  }
  // 看门狗：内嵌浏览器偶尔会暂停动画帧，超过 250ms 没动静就用定时器顶上
  setInterval(function () {
    if (Date.now() - lastFrameAt > 250) step();
  }, 120);
  function setHint() {
    if (mode === 'mic') hint.textContent = '麦克风已开启，大家一起喊，声音越大球跳得越高！';
    else if (mode === 'demo') hint.textContent = '现在是演示模式（麦克风没开起来）· 点一下页面可以再试一次开麦克风';
    else hint.textContent = '正在准备…';
  }
  function stopMic() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    if (audioCtx) { audioCtx.close().catch(function () {}); audioCtx = null; }
    analyser = null; dataArray = null;
  }
  function startDemo() {
    stopMic(); mode = 'demo'; targetLevel = 0.05; setHint();
  }
  function startMic() {
    if (mode === 'mic') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { startDemo(); return; }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function (s) {
      stream = s;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.fftSize);
      mode = 'mic'; setHint();
      (function sample() {
        if (mode !== 'mic' || !analyser) return;
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        analyser.getByteTimeDomainData(dataArray);
        var sum = 0;
        for (var i = 0; i < dataArray.length; i++) { var v = (dataArray[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / dataArray.length);
        targetLevel = Math.min(1, rms * 4.5);
        setTimeout(sample, 50);
      })();
    }).catch(function () { startDemo(); });
  }
  // 兜底：点一下屏幕任意处可以唤醒声音、重试麦克风。
  document.addEventListener('pointerdown', function () {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (mode !== 'mic') startMic();
  }, { passive: true });
  // 离开页面就停麦克风、停声音，回来不会自己接着响（点一下屏幕再开麦）
  document.addEventListener('visibilitychange', function () { if (document.hidden) startDemo(); });
  window.addEventListener('pagehide', function () { startDemo(); });
  window.addEventListener('beforeunload', function () { startDemo(); });
  window.addEventListener('blur', function () { startDemo(); });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();
  setHint();
  startMic();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
