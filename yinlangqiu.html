<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音浪球</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #070b1d; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #volbar { position: fixed; top: 14px; left: 4%; right: 4%; height: 40px; z-index: 5; pointer-events: none; }
  #volTrack { position: relative; height: 14px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.35); border-radius: 7px; pointer-events: auto; cursor: pointer; touch-action: none; }
  #volFill { height: 100%; width: 0%; background: linear-gradient(90deg, #38d977, #ffd23f 55%, #ff5a5a); border-radius: 7px; transition: width 0.08s linear; }
  #volMark { position: absolute; left: 30%; top: -5px; bottom: -5px; width: 3px; background: #fff; }
  #volMarkLabel { position: absolute; left: 30%; top: 20px; transform: translateX(-50%); font-size: 12px; color: #fff; opacity: 0.9; }
  #volText { position: absolute; right: 0; top: 20px; font-size: 13px; font-weight: bold; color: #fff; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="volbar">
  <div id="volTrack">
    <div id="volFill"></div>
    <div id="volMark"></div>
  </div>
  <div id="volMarkLabel">30%</div>
  <div id="volText">0%</div>
</div>
<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var volFill = document.getElementById('volFill');
  var volText = document.getElementById('volText');
  var volTrack = document.getElementById('volTrack');
  var volMark = document.getElementById('volMark');
  var volMarkLabel = document.getElementById('volMarkLabel');
  // 起跳音量标准，默认 30%，可以在音量条上左右拖动白线随时改
  var threshold = 0.30;
  function setThreshold(v) {
    threshold = Math.max(0.05, Math.min(0.95, v));
    volMark.style.left = (threshold * 100) + '%';
    volMarkLabel.style.left = (threshold * 100) + '%';
    volMarkLabel.textContent = Math.round(threshold * 100) + '%';
  }
  function thresholdFromEvent(e) {
    var rect = volTrack.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width;
  }
  var draggingThreshold = false;
  volTrack.addEventListener('pointerdown', function (e) {
    draggingThreshold = true;
    if (volTrack.setPointerCapture) volTrack.setPointerCapture(e.pointerId);
    setThreshold(thresholdFromEvent(e));
  });
  volTrack.addEventListener('pointermove', function (e) {
    if (draggingThreshold) setThreshold(thresholdFromEvent(e));
  });
  volTrack.addEventListener('pointerup', function () { draggingThreshold = false; });
  volTrack.addEventListener('pointercancel', function () { draggingThreshold = false; });
  var COLORS = ['#ff7eb6', '#c58cff', '#5aa9ff', '#3fd9a4', '#ffd23f', '#ff8a3d', '#ffffff', '#ff6b6b', '#7ef0e0', '#b8ff5e'];
  var balls = [];
  var W = 0, H = 0;
  var level = 0, targetLevel = 0;
  var mode = 'idle'; // idle | mic | demo（麦克风不可用时自动演示）
  var audioCtx = null, analyser = null, stream = null, dataArray = null;
  var lastW = 0, lastH = 0;
  function resize() {
    var oldW = lastW || window.innerWidth, oldH = lastH || window.innerHeight;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.max(320, Math.floor(W * window.devicePixelRatio));
    canvas.height = Math.max(200, Math.floor(H * window.devicePixelRatio));
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    if (!balls.length) { initBalls(); }
    else if (oldW > 0 && oldH > 0 && (W !== oldW || H !== oldH)) {
      // 窗口变了：球按比例挪到新尺寸里，铺满整个画面，别挤在旧角落
      var sx = W / oldW, sy = H / oldH;
      balls.forEach(function (b) {
        b.x = Math.min(Math.max(b.x * sx, b.r), W - b.r);
        b.baseY = Math.min(Math.max(b.baseY * sy, b.r + 6), H - b.r - 6);
        b.y = Math.min(Math.max(b.y * sy, b.r), H - b.r - 6);
        if (b.y > b.baseY) b.y = b.baseY;
      });
    }
    lastW = W; lastH = H;
  }
  function initBalls() {
    balls = [];
    for (var i = 0; i < 60; i++) {
      var r = 14 + Math.random() * 26;
      var top = 70, span = Math.max(40, H - top - r - 6);
      var y = top + Math.random() * span; // 铺满整个画面，不再全贴在底边
      balls.push({ x: 30 + Math.random() * Math.max(60, W - 60), y: y, r: r, baseY: y, vy: 0, phase: Math.random() * Math.PI * 2, speed: 0.6 + Math.random() * 1.4, color: COLORS[i % COLORS.length], alpha: 0.75 + Math.random() * 0.25 });
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H - 2); ctx.lineTo(W, H - 2); ctx.stroke();
    balls.forEach(function (b) {
      var grad = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r);
      grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.25, b.color); grad.addColorStop(1, b.color);
      ctx.globalAlpha = b.alpha; ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    });
  }
  function tick() {
    if (mode === 'demo') {
      var now0 = Date.now() / 1000;
      targetLevel = 0.12 + 0.06 * Math.sin(now0 * 0.9);
    }
    level += (targetLevel - level) * 0.18;
    if (Math.abs(targetLevel - level) < 0.002) level = targetLevel;
    // 音量标准：低于设定的阈值不跳；超过阈值才跳，越往上跳得越高
    var jump = level < threshold ? 0 : (level - threshold) / (1 - threshold);
    volFill.style.width = Math.round(level * 100) + '%';
    volText.textContent = Math.round(level * 100) + '%';
    var now = Date.now() / 1000;
    balls.forEach(function (b) {
      if (jump <= 0) {
        b.vy = 0; b.y += (b.baseY - b.y) * 0.12; b.x += Math.sin(now * 0.6 + b.phase) * 0.15;
      } else {
        if (b.y >= b.baseY - 0.5 && b.vy >= 0) { b.vy = -(6 + jump * 30 * b.speed); }
        b.vy += 0.7; b.y += b.vy;
        if (b.y > b.baseY) { b.y = b.baseY; b.vy = 0; }
        if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.55; }
        b.x += Math.sin(now * 1.2 + b.phase) * 0.5 * jump;
      }
      if (b.x < b.r) b.x = b.r; if (b.x > W - b.r) b.x = W - b.r; if (b.y < b.r) b.y = b.r;
    });
    draw();
    requestAnimationFrame(tick);
  }
  function stopMic() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    if (audioCtx) { audioCtx.close().catch(function () {}); audioCtx = null; }
    analyser = null; dataArray = null;
  }
  function startDemo() {
    stopMic(); mode = 'demo'; targetLevel = 0.12;
  }
  function startMic() {
    if (mode === 'mic') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { startDemo(); return; }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function (s) {
      stream = s;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.fftSize);
      mode = 'mic';
      (function sample() {
        if (mode !== 'mic' || !analyser) return;
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        analyser.getByteTimeDomainData(dataArray);
        var sum = 0;
        for (var i = 0; i < dataArray.length; i++) { var v = (dataArray[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / dataArray.length);
        targetLevel = Math.min(1, rms * 4.5);
        setTimeout(sample, 50);
      })();
    }).catch(function () { startDemo(); });
  }
  // 兜底：点一下屏幕任意处可以唤醒声音、重试麦克风。
  // 正常第一次使用不需要点——点浏览器弹出的“允许使用麦克风”那一下就够了。
  document.addEventListener('pointerdown', function () {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (mode !== 'mic') startMic();
  }, { passive: true });
  // 离开页面就停麦克风、停声音，回来不会自己接着响（点一下屏幕再开麦）
  document.addEventListener('visibilitychange', function () { if (document.hidden) startDemo(); });
  window.addEventListener('pagehide', function () { startDemo(); });
  window.addEventListener('beforeunload', function () { startDemo(); });
  window.addEventListener('blur', function () { startDemo(); });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();
  startMic();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
