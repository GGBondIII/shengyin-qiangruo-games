.wrap{max-width:560px;margin:0 auto;padding:12px 12px 20px}
header{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:rgba(255,255,255,.92);border-radius:16px;padding:10px 14px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
header h1{font-size:20px;margin:0;line-height:1.2}
header h1 small{display:block;font-size:12px;color:#5a7d5e;font-weight:400}
#score{
  font-size:20px;font-weight:800;color:#1b6b2e;white-space:nowrap;
  background:#e6f4d7;border:2px solid #9ccc65;border-radius:12px;padding:6px 10px;
}
.speedbar{
  display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  background:rgba(255,255,255,.92);border-radius:16px;padding:10px 12px;margin:10px 0;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.speedbar .lbl{font-weight:700;font-size:15px}
.speedbar button, .bigbtn{
  font-family:inherit;border:none;cursor:pointer;border-radius:999px;
  padding:10px 18px;font-size:16px;font-weight:700;color:#1e4622;
  background:#dcedc8;border:2px solid #aed581;
}
.speedbar button.active{background:#43a047;color:#fff;border-color:#2e7d32;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.speedbar button:active,.bigbtn:active{transform:scale(.96)}
#listenHint{
  text-align:center;color:#fff;font-size:16px;font-weight:700;margin:2px 0 8px;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
#listenHint .ear{background:rgba(0,0,0,.35);border-radius:999px;padding:6px 14px}
#stage{
  position:relative;overflow:hidden;height:min(58vh,520px);
  border-radius:20px;background:rgba(10,40,18,.45);
  border:3px solid rgba(255,255,255,.65);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  touch-action:manipulation;
}
.rain{position:absolute;top:-40px;width:2px;height:34px;border-radius:2px;
  background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(220,240,255,.85));
  animation:rainfall 1.5s linear infinite;pointer-events:none}
@keyframes rainfall{from{transform:translateY(0)}to{transform:translateY(620px)}}
#stage.heavy .rain{animation-duration:.65s;opacity:.9}
#stage.light .rain{animation-duration:1.7s;opacity:.35}
#stage.light .rain:nth-child(even){display:none}
.symbol{
  position:absolute;width:76px;height:76px;border-radius:50%;
  font-size:44px;font-weight:900;line-height:76px;text-align:center;
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  background:#fffef5;color:#1b5e20;border:3px solid #8bc34a;
  box-shadow:0 5px 0 #689f38,0 8px 16px rgba(0,0,0,.35);
  cursor:pointer;user-select:none;padding:0;
}
.symbol.weak{color:#1565c0;border-color:#64b5f6;box-shadow:0 5px 0 #1e88e5,0 8px 16px rgba(0,0,0,.35)}
.symbol:active{transform:scale(.92)}
.symbol.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.symbol.pop{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.floatscore{
  position:absolute;font-size:26px;font-weight:900;color:#ffeb3b;
  text-shadow:0 2px 4px rgba(0,0,0,.7);pointer-events:none;z-index:5;
  animation:floatup .9s forwards;
}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
#toast{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  background:rgba(255,255,255,.95);color:#333;border-radius:999px;
  padding:10px 18px;font-size:17px;font-weight:700;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:6;max-width:94%;
}
#toast.show{opacity:1}
#toast.good{color:#1b6b2e}
#toast.try{color:#c62828}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;background:rgba(8,32,15,.72);z-index:10;padding:20px;
}
.overlay h2{color:#fff;font-size:30px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.overlay p{color:#e8f5e9;font-size:17px;line-height:1.7;margin:0;max-width:420px}
.overlay p b{color:#ffeb3b}
.overlay .card{
  background:#fffef5;border-radius:16px;padding:14px 18px;color:#2e4a2f;
  font-size:16px;line-height:1.8;text-align:left;max-width:420px;
}
.bigbtn{background:#ffb300;border-color:#ff8f00;color:#4e342e;font-size:19px;padding:13px 30px;
  box-shadow:0 4px 0 #e65100,0 6px 14px rgba(0,0,0,.35)}
.bigbtn.green{background:#43a047;border-color:#2e7d32;color:#fff;box-shadow:0 4px 0 #1b5e20,0 6px 14px rgba(0,0,0,.35)}
a.bigbtn{display:inline-block;text-decoration:none}
.hidden{display:none!important}
footer{text-align:center;color:#e8f5e9;font-size:13px;margin-top:12px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
footer .note{background:rgba(0,0,0,.35);border-radius:999px;padding:5px 12px}
.legend{display:flex;gap:10px;justify-content:center;margin-top:10px}

<script>
(function(){
"use strict";
var stage=document.getElementById("stage");
var scoreEl=document.getElementById("score");
var toast=document.getElementById("toast");
var startOverlay=document.getElementById("startOverlay");
var passOverlay=document.getElementById("passOverlay");
var startBtn=document.getElementById("startBtn");
var againBtn=document.getElementById("againBtn");
var rainHeavy=document.getElementById("rainHeavy");
var rainLight=document.getElementById("rainLight");

var SPEEDS={slow:{stepMs:850,spawnMs:1700,label:"极慢"},
            medium:{stepMs:500,spawnMs:1200,label:"中等"},
            fast:{stepMs:280,spawnMs:900,label:"极快"}};
var STEP_PX=34, PHRASE_MS=6000, PASS_SCORE=50;
var score=0, phase="heavy", speed="medium", playing=false, passed=false;
var symbols=[], symbolId=0, spawnTimer=null, phaseTimer=null, toastTimer=null;
var audioCtx=null, forceSym=null;

/* ---- rain backdrop drops (visual only; the sound is the real cue) ---- */
var drops=[];
for(var i=0;i<26;i++){
  var d=document.createElement("div"); d.className="rain";
  d.style.left=(Math.random()*100).toFixed(1)+"%";
  d.style.animationDelay=(Math.random()*1.5).toFixed(2)+"s";
  d.style.height=(26+Math.random()*18).toFixed(0)+"px";
  stage.appendChild(d); drops.push(d);
}

/* ---- synthesised feedback sounds (Web Audio, no files) ---- */
function ctx(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(audioCtx && audioCtx.state==="suspended"){ audioCtx.resume(); }
  return audioCtx;
}
function tone(freq,start,dur,type,vol){
  var c=ctx(); if(!c) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,c.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol||0.25,c.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+start+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.05);
}
function playDing(){ tone(880,0,0.18,"sine",0.3); tone(1318,0.12,0.3,"sine",0.3); }
function playBuzz(){ tone(150,0,0.32,"sawtooth",0.18); tone(110,0.05,0.3,"sawtooth",0.15); }
function playFanfare(){ var n=[523,659,784,1046,1318]; for(var i=0;i<n.length;i++){ tone(n[i],i*0.13,0.35,"triangle",0.3);} }

/* ---- rain phases: heavy (f) and light (p) alternate every 6 s ---- */
function applyPhase(){
  stage.classList.remove("heavy","light");
  stage.classList.add(phase);
  if(phase==="heavy"){
    rainLight.pause();
    var p=rainHeavy.play(); if(p&&p.catch){p.catch(function(){});}
  }else{
    rainHeavy.pause();
    var q=rainLight.play(); if(q&&q.catch){q.catch(function(){});}
  }
}
function switchPhase(){
  if(!playing||passed) return;
  phase=(phase==="heavy")?"light":"heavy";
  applyPhase();
}

/* ---- falling symbols: jump one step, then pause (stepwise, clickable) ---- */
function spawnSymbol(){
  if(!playing||passed) return;
  var matchSym=(phase==="heavy")?"f":"p";
  // Mostly the symbol that matches the rain you hear right now,
  // sometimes the other one -- so the child really has to listen.
  // forceSym is only used by the automated test hook below.
  var sym=forceSym||((Math.random()<0.7)?matchSym:(matchSym==="f"?"p":"f"));
  var btn=document.createElement("button");
  btn.type="button";
  btn.className="symbol"+(sym==="p"?" weak":"");
  btn.textContent=sym;
  btn.setAttribute("aria-label",sym==="f"?"强 f":"弱 p");
  var maxX=Math.max(0,stage.clientWidth-80);
  var x=Math.floor(Math.random()*maxX);
  var y=-80;
  btn.style.left=x+"px"; btn.style.top=y+"px";
  btn.dataset.sym=sym;
  btn.addEventListener("click",function(){ onSymbolClick(btn); });
  stage.appendChild(btn);
  symbols.push({el:btn,sym:sym,y:y,nextStep:Date.now()+SPEEDS[speed].stepMs});
}
function tick(){
  if(!playing||passed) return;
  var now=Date.now(), stepMs=SPEEDS[speed].stepMs, h=stage.clientHeight;
  for(var i=symbols.length-1;i>=0;i--){
    var s=symbols[i];
    if(now>=s.nextStep){
      s.y+=STEP_PX;
      s.nextStep=now+stepMs;
      if(s.y>h+10){ s.el.remove(); symbols.splice(i,1); continue; }
      s.el.style.top=s.y+"px";
    }
  }
}
setInterval(tick,50);
function scheduleSpawn(){
  if(spawnTimer) clearTimeout(spawnTimer);
  spawnTimer=setTimeout(function(){ spawnSymbol(); scheduleSpawn(); },SPEEDS[speed].spawnMs);
}

/* ---- clicking ---- */
function showToast(text,good){
  toast.textContent=text;
  toast.className="show "+(good?"good":"try");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toast.className=""; },1600);
}
function floatScore(x,y){
  var f=document.createElement("div"); f.className="floatscore"; f.textContent="+10";
  f.style.left=x+"px"; f.style.top=y+"px"; stage.appendChild(f);
  setTimeout(function(){ f.remove(); },950);
}
function onSymbolClick(btn){
  if(!playing||passed) return;
  var sym=btn.dataset.sym;
  var correct=(phase==="heavy"&&sym==="f")||(phase==="light"&&sym==="p");
  if(correct){
    score+=10;
    scoreEl.textContent="分数："+score+"/50";
    playDing();
    var r=btn.getBoundingClientRect(), sr=stage.getBoundingClientRect();
    floatScore(r.left-sr.left, r.top-sr.top);
    btn.classList.add("pop");
    var idx=-1;
    for(var i=0;i<symbols.length;i++){ if(symbols[i].el===btn){ idx=i; break; } }
    if(idx>=0) symbols.splice(idx,1);
    setTimeout(function(){ btn.remove(); },350);
    if(score>=PASS_SCORE){
      showToast("答对啦！+10 分",true);
      passGame();
    }else{
      showToast("答对啦！+10 分",true);
    }
  }else{
    playBuzz();
    showToast("再听一听 👂 是大雨还是小雨？",false);
    btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
  }
}
function clearSymbols(){
  symbols.forEach(function(s){ s.el.remove(); });
  symbols=[];
}
function passGame(){
  passed=true; playing=false;
  if(spawnTimer) clearTimeout(spawnTimer);
  if(phaseTimer) clearInterval(phaseTimer);
  rainHeavy.pause(); rainLight.pause();
  playFanfare();
  setTimeout(function(){ passOverlay.classList.remove("hidden"); },450);
}

/* ---- start / restart ---- */
function startGame(){
  ctx();
  score=0; passed=false; playing=true;
  scoreEl.textContent="分数：0/50";
  clearSymbols();
  startOverlay.classList.add("hidden");
  passOverlay.classList.add("hidden");
  phase="heavy";
  applyPhase();
  if(phaseTimer) clearInterval(phaseTimer);
  phaseTimer=setInterval(switchPhase,PHRASE_MS);
  spawnSymbol();
  scheduleSpawn();
}
startBtn.addEventListener("click",startGame);
againBtn.addEventListener("click",startGame);

/* ---- speed control: takes effect immediately, also mid-game ---- */
var speedBtns=document.querySelectorAll(".speedbar button[data-speed]");
speedBtns.forEach(function(b){
  b.addEventListener("click",function(){
    speed=b.dataset.speed;
    speedBtns.forEach(function(x){ x.classList.toggle("active",x===b); });
    if(playing&&!passed){ scheduleSpawn(); }
  });
});

/* ---- test hook (invisible): lets an automated check drive the game ---- */
window.__game={
  getState:function(){ return {score:score,phase:phase,speed:speed,playing:playing,passed:passed,
    stepMs:SPEEDS[speed].stepMs,spawnMs:SPEEDS[speed].spawnMs,symbols:symbols.length,
    heavyPaused:rainHeavy.paused,lightPaused:rainLight.paused,
    heavySrc:rainHeavy.currentSrc.slice(0,30),lightSrc:rainLight.currentSrc.slice(0,30)}; },
  start:startGame,
  setSpeed:function(s){ var b=document.querySelector('.speedbar button[data-speed="'+s+'"]'); if(b) b.click(); },
  clickFirst:function(sym){
    for(var i=0;i<symbols.length;i++){ if(!sym||symbols[i].sym===sym){ symbols[i].el.click(); return symbols[i].sym; } }
    return null;
  },
  spawnForTest:function(sym){
    forceSym=sym;
    var before=symbols.length; spawnSymbol(); forceSym=null;
    return symbols.length>before?symbols[symbols.length-1].sym:null;
  }
};
})();
</script>
